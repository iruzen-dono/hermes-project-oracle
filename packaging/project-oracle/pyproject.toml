[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-oracle"
version = "2.5.1"
description = "Short install name for hermes-project-oracle: audit AGENTS.md / CLAUDE.md against the repository, and generate it when missing."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jules Zhou", email = "juleszhou01@gmail.com" }]
keywords = [
    "agents-md",
    "claude-md",
    "ai-agents",
    "context-engineering",
    "developer-tools",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["hermes-project-oracle>=2.5.0"]

[project.urls]
Homepage = "https://github.com/iruzen-dono/hermes-project-oracle"
Repository = "https://github.com/iruzen-dono/hermes-project-oracle"
Issues = "https://github.com/iruzen-dono/hermes-project-oracle/issues"
Changelog = "https://github.com/iruzen-dono/hermes-project-oracle/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = []
