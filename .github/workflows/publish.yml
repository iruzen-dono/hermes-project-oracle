name: Publish

# Releases are cut by pushing a tag. No long-lived API token is involved:
# PyPI trusts this workflow through OIDC, so the credential is minted per run
# and expires with it.
#
# One-time setup on PyPI — one publisher per project, added from the PROJECT's
# own sidebar (Your projects -> Manage -> Publishing). The account-level
# "pending publisher" page does not work here: it only creates projects that do
# not exist yet.
#
#   project-oracle          owner iruzen-dono · repo project-oracle · publish.yml · pypi
#   hermes-project-oracle   owner iruzen-dono · repo project-oracle · publish.yml · pypi
#
# The repository name is the field that matters and it changed when the repo was
# renamed from hermes-project-oracle to project-oracle: BOTH entries had to be
# edited to match, or the token exchange fails with
# `invalid-publisher` / `repository not found`.
# Nothing is stored in GitHub secrets.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Assert the tag matches the package version
        run: |
          python - "${GITHUB_REF_NAME}" "${GITHUB_REF_TYPE}" <<'PY'
          import re, sys, tomllib
          from pathlib import Path

          tag, ref_type = sys.argv[1], sys.argv[2]
          if ref_type != "tag":
              # workflow_dispatch is the smoke-test path: there is no tag to agree with.
              print(f"not a tag run ({ref_type}: {tag}) - version check skipped")
              raise SystemExit(0)

          tag = tag.lstrip("v")
          source = re.search(r'__version__ = "([^"]+)"',
                             Path("scripts/version.py").read_text(encoding="utf-8")).group(1)
          legacy = tomllib.loads(Path("packaging/hermes-project-oracle/pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          problems = [f"{name} is {got}, tag says {tag}"
                      for name, got in (("scripts/version.py", source), ("legacy pointer", legacy))
                      if got != tag]
          if problems:
              print("::error::" + "; ".join(problems))
              raise SystemExit(1)
          print(f"tag {tag} matches both distributions")
          PY

      - name: Build both distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --outdir dist
          python -m build --outdir dist-legacy packaging/hermes-project-oracle
          python -m twine check dist/* dist-legacy/*

      - name: Assert the sdist carries no stale build metadata
        run: |
          if tar -tzf dist/project_oracle-*.tar.gz \
             | grep -qE 'egg-info/(PKG-INFO|entry_points|requires|top_level)'; then
            echo "::error::the sdist ships stale .egg-info build metadata"
            exit 1
          fi

      # The migration pointer must never ship the modules: installing it next to
      # project-oracle would drop the same oracle_*.py files twice.
      - name: Assert the pointer ships no code
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist-legacy/*.whl")[0]).namelist()
          code = [n for n in names if n.endswith(".py")]
          if code:
              print(f"::error::the migration pointer ships code: {code}")
              raise SystemExit(1)
          print("pointer is metadata only")
          PY

      - name: Smoke-test the wheel's entry points
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/oracle-lint --version
          /tmp/clean/bin/oracle-check --version
          /tmp/clean/bin/oracle-scan --version

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*
            dist-legacy/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/project-oracle
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: artifacts

      # The artifact keeps the two directories it was built from, and a trusted
      # publishing token is scoped to ONE project: two projects need two
      # exchanges, so split them and publish separately.
      - name: Split the two distributions
        run: |
          mkdir -p dist-canonical dist-legacy
          find artifacts/dist -maxdepth 1 -type f -exec mv {} dist-canonical/ \;
          find artifacts/dist-legacy -maxdepth 1 -type f -exec mv {} dist-legacy/ \;
          ls -l dist-canonical dist-legacy

      - name: Publish project-oracle
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-canonical
          skip-existing: true

      - name: Publish the hermes-project-oracle migration pointer
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-legacy
          skip-existing: true
