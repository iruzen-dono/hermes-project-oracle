name: Publish

# Releases are cut by pushing a tag. No long-lived API token is involved:
# PyPI trusts this workflow through OIDC, so the credential is minted per run
# and expires with it.
#
# One-time setup on PyPI (Your projects → Publishing):
#   1. add a *pending publisher* for `hermes-project-oracle`
#      and one for `project-oracle` (the alias distribution)
#      owner: iruzen-dono · repository: hermes-project-oracle
#      workflow: publish.yml · environment: pypi
#   2. nothing to store in GitHub secrets.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Assert the tag matches the package version
        run: |
          python - "$GITHUB_REF_NAME" <<'PY'
          import re, sys, tomllib
          from pathlib import Path

          tag = sys.argv[1].lstrip("v")
          source = re.search(r'__version__ = "([^"]+)"',
                             Path("scripts/version.py").read_text(encoding="utf-8")).group(1)
          alias = tomllib.loads(Path("packaging/project-oracle/pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          problems = [f"{name} is {got}, tag says {tag}"
                      for name, got in (("scripts/version.py", source), ("alias", alias))
                      if got != tag]
          if problems:
              print("::error::" + "; ".join(problems))
              raise SystemExit(1)
          print(f"tag {tag} matches both distributions")
          PY

      - name: Build both distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --outdir dist
          python -m build --outdir dist-alias packaging/project-oracle
          python -m twine check dist/* dist-alias/*

      - name: Assert the sdist carries no stale build metadata
        run: |
          if tar -tzf dist/hermes_project_oracle-*.tar.gz \
             | grep -qE 'egg-info/(PKG-INFO|entry_points|requires|top_level)'; then
            echo "::error::the sdist ships stale .egg-info build metadata"
            exit 1
          fi

      - name: Smoke-test the wheel's entry points
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/oracle-lint --version
          /tmp/clean/bin/oracle-check --version
          /tmp/clean/bin/oracle-scan --version

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*
            dist-alias/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/hermes-project-oracle
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # The alias may already exist while the real package does not (or the
          # reverse); skipping existing files keeps a re-run idempotent.
          skip-existing: true
