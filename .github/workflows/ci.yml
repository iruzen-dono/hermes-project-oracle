name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    timeout-minutes: 10

    steps:
      # v5/v6 target Node 24 — v4/v5 emit the "Node.js 20 is deprecated"
      # annotation on every run (forced onto Node 24 anyway).
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest mypy pytest-cov pyyaml

      - name: Install the package (editable)
        run: pip install -e .

      - name: Check syntax
        run: python -m compileall . -f -q

      - name: Lint with ruff
        run: python -m ruff check .

      - name: Type-check with mypy
        run: python -m mypy scripts/ --ignore-missing-imports

      - name: Run tests
        run: >-
          python -m pytest tests/ -v --tb=short
          --cov=scripts --cov-report=term --cov-fail-under=60

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Validate metadata
        run: python -m twine check dist/*

      - name: Install the wheel in a clean venv and smoke-test entry points
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/oracle-scan --version
          /tmp/clean/bin/oracle-generate --version
          /tmp/clean/bin/oracle-vault --version
          /tmp/clean/bin/oracle-scan --help > /dev/null
