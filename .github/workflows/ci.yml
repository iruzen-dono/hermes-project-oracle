name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    timeout-minutes: 10

    steps:
      # v5/v6 target Node 24 — v4/v5 emit the "Node.js 20 is deprecated"
      # annotation on every run (forced onto Node 24 anyway).
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest mypy pytest-cov pyyaml

      - name: Install the package (editable)
        run: pip install -e .

      - name: Check syntax
        run: python -m compileall . -f -q

      - name: Lint with ruff
        run: python -m ruff check .

      - name: Type-check with mypy
        run: python -m mypy scripts/ --ignore-missing-imports

      - name: Run tests
        run: >-
          python -m pytest tests/ -v --tb=short
          --cov=scripts --cov-report=term --cov-fail-under=60

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Validate metadata
        run: python -m twine check dist/*

      - name: Build + validate the migration pointer
        run: |
          python -m build --outdir dist-legacy packaging/hermes-project-oracle
          python -m twine check dist-legacy/*

      - name: Assert the sdist carries no stale build metadata
        run: |
          if tar -tzf dist/project_oracle-*.tar.gz \
             | grep -qE 'egg-info/(PKG-INFO|entry_points|requires|top_level)'; then
            echo "::error::the sdist ships stale .egg-info build metadata"
            exit 1
          fi

      - name: Install the wheel in a clean venv and smoke-test entry points
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/oracle-scan --version
          /tmp/clean/bin/oracle-generate --version
          /tmp/clean/bin/oracle-vault --version
          /tmp/clean/bin/oracle-scan --help > /dev/null

  action:
    # The composite action is the only surface users run inside their own CI,
    # and nothing else here executes it: action.yml can rot without a sign.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Build one drifted and one matching fixture repository
        run: |
          for d in drifted clean; do
            mkdir -p "$RUNNER_TEMP/$d/src"
            printf '%s\n' '{"name":"fixture","scripts":{"build":"tsc","lint":"eslint src"}}' \
              > "$RUNNER_TEMP/$d/package.json"
            printf '%s\n' '- Run `npm run lint` before opening a pull request.' \
                          '- Build with `npm run build`.' \
              > "$RUNNER_TEMP/$d/AGENTS.md"
          done
          printf '%s\n' '- Run `npm run test` before opening a pull request.' \
                        '- Build with `npm run build`.' \
            > "$RUNNER_TEMP/drifted/AGENTS.md"

      - name: The action must fail on a drifted context file
        id: drifted
        continue-on-error: true
        uses: ./
        with:
          path: ${{ runner.temp }}/drifted
          agents: AGENTS.md
          lint: "true"

      - name: The action must pass on a context file that matches
        uses: ./
        with:
          path: ${{ runner.temp }}/clean
          agents: AGENTS.md

      - name: Assert the drift run actually failed
        run: |
          if [ "${{ steps.drifted.outcome }}" != "failure" ]; then
            echo "::error::the action passed on a context file the repository contradicts"
            exit 1
          fi

  dogfood:
    # The project describes itself. If its own AGENTS.md drifts from the code,
    # either the file is wrong or the tool is — both are worth failing on.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Scan the repository
        run: python scripts/oracle_scan.py --path . --output .oracle/

      - name: The committed context must still match the code
        run: python scripts/oracle_check.py --path . --agents AGENTS.md

      - name: The committed context must survive its own audit
        run: python scripts/oracle_lint.py AGENTS.md --path . --max-noise 20
